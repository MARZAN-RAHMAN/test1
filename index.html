<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101322">
  <meta name="description" content="A little hello from the internet.">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101322;
      color: #f5f4ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 16%, rgba(125, 92, 255, .22), transparent 34rem),
        radial-gradient(ellipse at 88% 82%, rgba(44, 217, 190, .12), transparent 30rem),
        #101322;
    }

    .site-nav {
      position: fixed;
      z-index: 2;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: .35rem;
      padding: .35rem;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(16,19,34,.68);
      backdrop-filter: blur(16px);
    }

    .site-nav a {
      padding: .62rem .9rem;
      border-radius: 999px;
      color: #c5c2d8;
      font-size: .82rem;
      font-weight: 600;
      text-decoration: none;
      transition: color .2s ease, background .2s ease;
    }

    .site-nav a:hover, .site-nav a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.12); }
    .site-nav a:focus-visible { outline: 2px solid #77ead4; outline-offset: 2px; }

    .glow {
      position: fixed;
      width: 28rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #8c6bff;
      filter: blur(110px);
      opacity: .14;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .glow.one { top: -18rem; left: -10rem; }
    .glow.two { right: -18rem; bottom: -18rem; background: #36e2c0; animation-delay: -5s; }

    main {
      position: relative;
      width: min(680px, calc(100% - 2.5rem));
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.75rem, 8vw, 5rem);
      text-align: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
      box-shadow: 0 32px 100px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(18px);
      animation: arrive .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 1.6rem;
      color: #b8b4d5;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .spark { color: #6fe7cf; font-size: 1rem; }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 11vw, 6.6rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 760;
    }

    h1 span {
      display: block;
      padding: .08em 0 .12em;
      color: transparent;
      background: linear-gradient(100deg, #b9a6ff 10%, #f3c3ff 52%, #77ead4 100%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .subtitle {
      max-width: 27rem;
      margin: 1.5rem auto 2.25rem;
      color: #aaa9bd;
      font-size: clamp(1rem, 2.4vw, 1.125rem);
      line-height: 1.7;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      padding: .9rem 1.25rem;
      color: #f5f4ff;
      background: rgba(255,255,255,.08);
      font: inherit;
      font-size: .9rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    button:hover { transform: translateY(-2px); background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); }
    button:focus-visible { outline: 3px solid #77ead4; outline-offset: 4px; }
    button:active { transform: translateY(0); }
    .arrow { color: #77ead4; transition: transform .2s ease; }
    button:hover .arrow { transform: translateX(4px); }

    .footer {
      position: absolute;
      right: 1.5rem;
      bottom: 1.25rem;
      left: 1.5rem;
      color: rgba(218,216,236,.42);
      font-size: .72rem;
      letter-spacing: .04em;
      text-align: center;
    }

    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate(4rem, 3rem) scale(1.15); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <p class="eyebrow"><span class="spark" aria-hidden="true">✦</span> A small beginning</p>
    <h1>Hello,<span>World!</span></h1>
    <p class="subtitle" id="message">A little page with a lot of possibility. Glad you’re here.</p>
    <button type="button" id="hello-button">Say hello <span class="arrow" aria-hidden="true">→</span></button>
  </main>
  <div class="footer">Made with a little bit of HTML &amp; CSS</div>
  <script>
    const button = document.querySelector('#hello-button');
    const message = document.querySelector('#message');
    button.addEventListener('click', () => {
      message.textContent = 'Hello right back at you. ✨';
      button.innerHTML = 'Hello, friend <span class="arrow" aria-hidden="true">✦</span>';
    });
  </script>
</body>
</html>
